<svg xmlns="http://www.w3.org/2000/svg" width="240" height="416" viewBox="0 0 240 416">
  <!-- Breathing-kagome motif: larger solid and smaller hatched triangles,
       joined at their tips with open hexagons between them. -->
  <defs>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <path d="M0 0V5" fill="none" stroke="#96d8d3" stroke-opacity=".4" stroke-width="1"/>
    </pattern>
  </defs>
  <g stroke="#96d8d3" stroke-opacity=".45" stroke-width="1.4" stroke-linejoin="miter">
    <g fill="#4bbdb4" fill-opacity=".22">
      <path d="M48 0H192L120 125Z"/>
      <path d="M-72 208H72L0 333Z"/>
      <path d="M168 208H312L240 333Z"/>
    </g>
    <g fill="url(#hatch)">
      <path d="M120 125L168 208H72Z"/>
      <path d="M0 333L48 416H-48Z"/>
      <path d="M240 333L288 416H192Z"/>
    </g>
  </g>
</svg>
